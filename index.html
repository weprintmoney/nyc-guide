<noscript id="agent-list"><h2>All places</h2><article><h3>AIRE Ancient Baths Tribeca</h3><p>Do · SoHo, Nolita &amp; Tribeca · Thermal baths and spa · $$$</p><p>Why: A warm, quiet reset in the middle of winter. Upper East Side location has a slightly better vibe, but both are solid.</p><p>Notes: Book the baths only, on a weekday, and get your massage somewhere else. Weekends can bring loud groups; check which pools are open.</p><p>Cost: 90-minute bath about $103. With massage, about $138-178.</p><p>Getting in: Book online at beaire.com and arrive 15 minutes early. 18+.</p><p>Get this: The thermal pools (hot, cold and the flotarium) and a salt scrub.</p><p>The feel: Candlelit Roman-style baths in a converted warehouse. Calm on a weekday morning; weekends can bring loud groups.</p><p>Access: Barefoot on wet stone floors; steps and stairs into pools.</p><p>Hours: Mon–Thu 10am–10pm; Fri–Sun 8am–11pm. Holiday hours may differ.</p><p>Address: 88 Franklin St, New York, NY 10013</p><p>Book: https://beaire.com/en/aire-ancient-baths-newyork-tribeca/experiences</p><p>Website: https://beaire.com</p><p>Tags: Date night, Spa, Splurge</p></article><article><h3>Bergdorf Goodman</h3><p>Do · Midtown · Department store · $$$$</p><p>Why: The windows are the best on Fifth, and BG is one of the nicest seats in Midtown.</p><p>Notes: Some of the best windows in the city, and worth going in even just to look. Book lunch at BG on 7 and see the windows on the way in.</p><p>Cost: Luxury prices; lunch or tea at BG on 7.</p><p>Getting in: Book BG, the 7th-floor restaurant, on OpenTable.</p><p>Get this: Look at the holiday windows, wander the beauty floor, then lunch or tea at BG overlooking Central Park.</p><p>The feel: Hushed, gorgeous and very New York.</p><p>Access: Department store with elevators; BG restaurant is on the 7th floor.</p><p>Hours: Store hours shift through December, so check before going. BG serves roughly noon to 6pm (to 5pm Sunday).</p><p>Address: 754 Fifth Ave, New York, NY 10019</p><p>Book: https://www.opentable.com/bg-bergdorf-goodman</p><p>Website: https://www.bergdorfgoodman.com</p><p>Tags: Classic New York, Easy on the feet, Holiday season, Shopping, Splurge, Views</p></article><article><h3>Brooklyn Heights Promenade</h3><p>Do · Brooklyn · Skyline walk · Free</p><p>Why: The best free skyline view in the city, and you can take it in sitting down.</p><p>Notes: Flat, benches all along, and gorgeous. Go ~20 min before sunset, walk Montague past the decorated brownstones, then dinner nearby. Windy in December.</p><p>Cost: Free.</p><p>Getting in: No tickets needed.</p><p>Get this: Taxi to the end of Montague Street, sit on a bench facing lower Manhattan and the Brooklyn Bridge, and stay through blue hour.</p><p>The feel: Quiet, tree-lined and very pretty, with brownstones behind you.</p><p>Access: Flat walkway lined with benches; taxi to the end of Montague St.</p><p>Hours: Open daily; best at dusk.</p><p>Address: Brooklyn Heights Promenade at Montague St, Brooklyn, NY 11201</p><p>Website: https://www.nycgovparks.org/parks/brooklyn-heights-promenade</p><p>Tags: Easy on the feet, Holiday season, Views</p></article><article><h3>Cafe Wha?</h3><p>Do · West &amp; Greenwich Village · Live music club since 1959 · $$</p><p>Why: Where Dylan and Hendrix played early on, and still the most fun night of live music in the Village.</p><p>Notes: One of my favorite nights out. The house band plays rock and soul covers and the whole room ends up singing. Reserve on their site and arrive 30 min early; it&#x27;s down a flight of stairs.</p><p>Cost: Music charge about $10–20pp depending on the night, plus a two-item food or drink minimum.</p><p>Getting in: Reserve a set through the Tickets &amp; Reservations page on their site (it runs on Eventbrite). Be there 30 minutes before the set or the table goes to the standby list.</p><p>Get this: The house band&#x27;s later set, a drink and something to share.</p><p>The feel: Low-ceilinged Village basement, packed tables, everybody singing along.</p><p>Access: Down a flight of stairs; seated at tables.</p><p>Hours: House band most nights Wed–Sun, with sets around 9pm and 10:30pm or later; closed Mon–Tue. 21+ on weekends.</p><p>Address: 115 MacDougal St, New York, NY 10012</p><p>Book: https://www.cafewha.com/tickets-reservations</p><p>Website: https://www.cafewha.com</p><p>Tags: Classic New York, Late night, Shows &amp; music</p></article><article><h3>Fifth Ave holiday windows + Saks light show</h3><p>Do · Midtown · Holiday windows walk · Free</p><p>Why: Classic December New York, and free. Finish with a drink at King Cole Bar, right on the route at 55th.</p><p>Notes: Crowds get heavy evenings and weekends. Weekday mornings are the calmest.</p><p>Cost: Free.</p><p>Getting in: No tickets needed. Go on a weekday morning or after 8pm to dodge the crowds.</p><p>Get this: Walk Fifth Avenue from 49th to 59th: Saks, the Rockefeller Center tree, St Patrick&#x27;s, then Bergdorf Goodman and Cartier.</p><p>The feel: Glittering, classic holiday New York.</p><p>Access: Outdoors on the sidewalk; long standing and walking in crowds.</p><p>Hours: Windows are up from Nov 23, 2026. The Saks light show runs nightly on the facade; check Saks for showtimes.</p><p>Address: Saks Fifth Avenue, 611 Fifth Ave, New York, NY 10022</p><p>Website: https://www.saksfifthavenue.com</p><p>Tags: Holiday season</p></article><article><h3>John Derian Company</h3><p>Do · East Village &amp; Lower East Side · Decor &amp; holiday shop · $$</p><p>Why: The prettiest ornaments in town and gifts nobody else will bring home.</p><p>Notes: The most whimsical shops in the city, especially the ornaments. Small rooms, so go right at 11:30 on a weekday.</p><p>Cost: From small glass ornaments to decoupage plates and furniture.</p><p>Getting in: Walk in.</p><p>Get this: Glass ornaments at the holiday shop (No. 8), decoupage plates at No. 6, and a peek into Dry Goods at No. 10.</p><p>The feel: Small, beautiful and a little whimsical.</p><p>Access: Three small shops next door to each other; furniture is downstairs at No. 10.</p><p>Hours: Tue–Sun 11:30am–6pm, and open Mondays in December. Three shops side by side at 6, 8 and 10 E 2nd St.</p><p>Address: 6 E 2nd St, New York, NY 10003</p><p>Book: https://johnderian.com/pages/our-locations</p><p>Website: https://johnderian.com</p><p>Tags: Holiday season, Shopping</p></article><article><h3>NYBG Holiday Train Show</h3><p>Do · The Bronx · Holiday exhibit · $$</p><p>Why: It&#x27;s the holiday thing locals pick when they want December without the Fifth Avenue crush.</p><p>Notes: Honestly magical, and so much calmer than Midtown. Car to the door, weekday morning if you can, and give it half a day.</p><p>Cost: Timed-entry All-Garden Pass, priced by date (peak and off-peak).</p><p>Getting in: Buy a timed ticket on the NYBG site; weekday slots are easiest.</p><p>Get this: Model trains looping through a glasshouse full of New York landmarks built from bark, seeds and leaves. Take it slowly; it&#x27;s a single loop.</p><p>The feel: Warm, green and charming, a nice break from Midtown.</p><p>Access: Step-free conservatory on one level; free loaner wheelchairs and an accessible tram on the grounds.</p><p>Hours: Runs Nov 14, 2026 to Jan 10, 2027, with daytime timed entry and some evening dates.</p><p>Address: Enid A. Haupt Conservatory, New York Botanical Garden, 2900 Southern Blvd, Bronx, NY 10458</p><p>Book: https://www.nybg.org/event/holiday-train-show/</p><p>Website: https://www.nybg.org</p><p>Tags: Holiday season, Museums &amp; culture</p></article><article><h3>Nordstrom (57th St flagship)</h3><p>Do · Midtown · Department store · $$$</p><p>Why: The comfortable way to shop Midtown, with real restaurants in the building for breaks.</p><p>Notes: Calm at 10am on a weekday, generous with fragrance samples, and good for a drink or lunch in-store.</p><p>Cost: Full range, with good sale racks; lunch at Wolf or Bistro Verde.</p><p>Getting in: No booking needed.</p><p>Get this: Fragrance (they&#x27;ll make you samples), the shoe floor with its Shoe Bar, and a sit-down lunch at Wolf.</p><p>The feel: Bright, roomy and easy to get around.</p><p>Access: Large modern store with elevators; restaurants and bars on several floors.</p><p>Hours: Mon–Sat 10am–9pm, Sun 11am–7pm. December: Dec 3 closes 6:30pm; Dec 6, 13, 20 open 11am–8pm; Dec 24 10am–6pm; closed Dec 25.</p><p>Address: 225 W 57th St, New York, NY 10019</p><p>Book: https://www.nordstrom.com/store-details/nordstrom-nyc-flagship</p><p>Website: https://www.nordstrom.com/store-details/nordstrom-nyc-flagship</p><p>Tags: Easy on the feet, Shopping</p></article><article><h3>Operation Mincemeat</h3><p>Do · Midtown · Broadway musical · $$$</p><p>Why: It&#x27;s the show theater people can&#x27;t stop pushing on each other, and it&#x27;s smart rather than splashy.</p><p>Notes: My favorite thing on Broadway right now. Original, funny, beautifully done. Get an aisle seat in the orchestra; main restrooms are two flights down, the accessible one is next door.</p><p>Cost: Tickets from about $63 on cheaper dates; prime seats cost more.</p><p>Getting in: Book ahead for December weekends.</p><p>Get this: A very British musical comedy about a real WWII deception plot. Sit in the orchestra.</p><p>The feel: Clever, silly, then unexpectedly moving. Small cast, big laughs.</p><p>Access: Step-free entrance from 45th St and step-free orchestra; seated show.</p><p>Hours: Running on Broadway through at least July 4, 2027. 2 hrs 35 min with a 20-minute intermission.</p><p>Address: Golden Theatre, 252 W 45th St, New York, NY 10036</p><p>Book: https://www.broadway.com/shows/operation-mincemeat/</p><p>Website: https://www.broadway.com/shows/operation-mincemeat/</p><p>Tags: Easy on the feet, Shows &amp; music</p></article><article><h3>The Frick: Kent Monkman show</h3><p>Do · Upper East Side · Kent Monkman at the Frick · $$</p><p>Why: A small, beautiful show: Kent Monkman&#x27;s paintings in conversation with the Frick&#x27;s Vermeer.</p><p>Notes: Gorgeous masterpieces in an intimate house. Get a timed ticket to skip the line, then walk ~10 min to Bemelmans.</p><p>Cost: Adults $30, seniors $22.</p><p>Getting in: Timed-entry tickets at frick.org/tickets. Book a week or more ahead for weekends.</p><p>Get this: Vermeer&#x27;s Officer and Laughing Girl alongside Monkman&#x27;s response paintings, then the Fragonard room and the house itself.</p><p>The feel: A quiet, intimate Gilded Age mansion. The opposite of a crowded blockbuster.</p><p>Access: Step-free; benches in galleries and wheelchairs available.</p><p>Hours: Show runs Nov 12, 2026 to Feb 22, 2027 in the Cabinet Gallery. Museum Thu–Mon 10:30am–5:30pm, Fri to 8:30pm; closed Tue–Wed.</p><p>Address: 1 E 70th St, New York, NY 10021</p><p>Book: https://frick.org/tickets</p><p>Website: https://www.frick.org</p><p>Tags: Classic New York, Easy on the feet, Museums &amp; culture</p></article><article><h3>The Met Opera</h3><p>Do · Lincoln Center &amp; Columbus Circle · Opera · $$$</p><p>Why: The grandest night out in December. Maria Stuarda is the pick if you want high drama.</p><p>Notes: Buy direct from metopera.org to avoid resale fees.</p><p>Cost: Tickets from about $45 to $400+.</p><p>Getting in: Buy at metopera.org. The best seats sell out around the holidays; rush and day-of tickets are cheaper.</p><p>Get this: Maria Stuarda (bel canto) or Samson et Dalila. Dress up and have a glass of champagne before the curtain.</p><p>The feel: Gilded and chandelier-lit. A proper grand-opera night.</p><p>Access: Elevators to all seating levels; seated for performances.</p><p>Hours: December: Samson et Dalila to Dec 23, Maria Stuarda Dec 6-22, The Magic Flute holiday production from Dec 11, and La Fanciulla del West opens Dec 31.</p><p>Address: 30 Lincoln Center Plaza, New York, NY 10023</p><p>Book: https://www.metopera.org</p><p>Website: https://www.metopera.org</p><p>Tags: Classic New York, Easy on the feet, Shows &amp; music, Splurge</p></article><article><h3>The Met: Krasner &amp; Pollock</h3><p>Do · Upper East Side · Museum exhibition · $$</p><p>Why: The first major New York look at Lee Krasner in over 20 years, hung side by side with Jackson Pollock across 120+ works.</p><p>Notes: Gorgeous and mostly convincing, though the later section leans heavy on Krasner. Go on a weekday morning, or a Friday or Saturday evening when it&#x27;s open late.</p><p>Cost: Adult admission $30 for out-of-state visitors, exhibition included.</p><p>Getting in: Timed tickets at metmuseum.org are a good idea. Closed Wednesdays.</p><p>Get this: The Krasner and Pollock retrospective, then the Temple of Dendur and Costume Art, the Costume Institute show (through Jan 10, 2027).</p><p>The feel: A big blockbuster. Lively, but the galleries are spacious.</p><p>Access: Large galleries with long walking; wheelchairs and stools on loan.</p><p>Hours: Show runs through Jan 31, 2027. Museum Sun–Tue and Thu 10am–5pm; Fri–Sat 10am–9pm; closed Wed and Dec 25.</p><p>Address: 1000 5th Ave, New York, NY 10028</p><p>Book: https://www.metmuseum.org/en/exhibitions/krasner-and-pollock-past-continuous</p><p>Website: https://www.metmuseum.org</p><p>Tags: Classic New York, Museums &amp; culture</p></article><article><h3>The Nutcracker at NYC Ballet</h3><p>Do · Lincoln Center &amp; Columbus Circle · Holiday ballet · $$$</p><p>Why: If you only do one holiday show, make it this one. It&#x27;s the real company doing the real Balanchine, and it feels like an occasion.</p><p>Notes: Prettier and more grown-up than the Rockettes, and the Sugar Plum Fairy still gets me. Book an evening show; matinees are full of kids.</p><p>Cost: Prices vary by date and seat, and December weekends run highest. Buy from NYC Ballet directly; resale sites mark it up hard.</p><p>Getting in: Book ahead; good seats for mid-December go early.</p><p>Get this: Pick an evening show and sit in the orchestra or first ring.</p><p>The feel: Dressy, glowing theater full of people who come every year.</p><p>Access: Elevators to every seating level; seated show.</p><p>Hours: Runs Nov 27, 2026 to Jan 3, 2027. About two hours with one intermission.</p><p>Address: David H. Koch Theater, 20 Lincoln Center Plaza, New York, NY 10023</p><p>Book: https://www.nycballet.com/season-and-tickets/george-balanchines-the-nutcracker</p><p>Website: https://www.nycballet.com</p><p>Tags: Classic New York, Easy on the feet, Holiday season, Shows &amp; music, Splurge</p></article><article><h3>Top of the Rock</h3><p>Do · Midtown · Observation deck · $$</p><p>Why: The best view in Midtown, because you can see the Empire State Building and the park from one spot.</p><p>Notes: Best balance of views: Empire State and Central Park in one look. Book sunset and bring gloves; the top deck is open-air.</p><p>Cost: General admission from about $45; sunset slots cost more.</p><p>Getting in: Buy a timed ticket online; pick the slot about 30 minutes before sunset.</p><p>Get this: Arrive before sunset, stay for the lights, and look south to the Empire State Building and north over Central Park.</p><p>The feel: Classic Art Deco deck with the whole skyline laid out.</p><p>Access: Elevators from street level to every deck, including the open-air 70th floor.</p><p>Hours: Daily 8am–midnight; last elevator 11:10pm.</p><p>Address: 30 Rockefeller Plaza, New York, NY 10112 (entrance on W 50th St)</p><p>Book: https://www.rockefellercenter.com/tickets/top-of-the-rock-observation-deck/</p><p>Website: https://www.rockefellercenter.com</p><p>Tags: Classic New York, Holiday season, Views</p></article><article><h3>Aldo Sohm Wine Bar</h3><p>Drink · Midtown · Wine bar · $$$</p><p>Why: Le Bernardin&#x27;s wine director runs it, so the list is serious without being stiff, and it&#x27;s an easy stop before a show.</p><p>Notes: Real glasses, real expertise, comfy sofas. Easy pre-theater stop, short cab from Broadway.</p><p>Cost: 40-plus wines by the glass and about 200 bottles; sharing plates.</p><p>Getting in: Book on the bar&#x27;s site; easier on weeknights.</p><p>Get this: Ask about the monthly flight, let them steer you by the glass, and order a few plates to share.</p><p>The feel: Grown-up living room: curved sofas, low lighting, quiet enough to talk.</p><p>Access: Listed as wheelchair accessible; sofas and table seating.</p><p>Hours: Mon–Thu noon–11pm, Fri noon–11:30pm, Sat 4–11:30pm; closed Sun.</p><p>Address: 151 W 51st St, New York, NY 10019</p><p>Book: https://www.aldosohmwinebar.com/</p><p>Website: https://www.aldosohmwinebar.com/</p><p>Tags: Date night, Easy on the feet, Splurge, Wine bar</p></article><article><h3>Bar Pisellino</h3><p>Drink · West &amp; Greenwich Village · Italian aperitivo bar · $$</p><p>Why: A pre-dinner spritz from the Via Carota team, right across the street.</p><p>Notes: Great spritzes and cappuccino. Tiny, mostly standing room, fills up at peak. Go in the afternoon or early on a weekday.</p><p>Cost: Spritzes and cocktails about $16-20.</p><p>Getting in: No reservations. Walk in and expect waits at peak.</p><p>Get this: A negroni or a spritz off the amaro and vermouth list. Espresso or a cappuccino by day.</p><p>The feel: Chic, tiny Italian cafe-bar, mostly standing room.</p><p>Access: Tiny and mostly standing.</p><p>Hours: About 7am–midnight, shorter some days</p><p>Address: 52 Grove St, New York, NY 10014</p><p>Website: https://www.barpisellino.com</p><p>Tags: Cocktails, Coffee &amp; breakfast, Walk-ins welcome</p></article><article><h3>Bemelmans Bar</h3><p>Drink · Upper East Side · Piano bar at The Carlyle · $$$</p><p>Why: Old New York at its most atmospheric, and an easy pairing with the Frick or the Met the same day.</p><p>Notes: The classic hotel bar martini, warm service. Touristy and loud once music starts. Walk-in line is slow, so go on a weekday before the 5:30pm set or book.</p><p>Cost: Cocktails about $25-30. Music cover about $20-35 once the sets start. Reserved tables carry a minimum spend.</p><p>Getting in: Resy releases tables about 3 months ahead, or walk in to the bar. December is the hardest month, with waits up to 2.5 hours at peak, so book a table rather than queue.</p><p>Get this: A martini or a champagne cocktail under the Ludwig Bemelmans murals.</p><p>The feel: Gold-leaf ceiling, hand-painted murals and live piano. Smart attire. It gets loud once the music starts.</p><p>Access: Step-free hotel entrance; seated at banquettes.</p><p>Hours: Sun–Mon noon–midnight; Tue–Thu noon–12:30am; Fri–Sat noon–1am. Piano and jazz sets start around 5:30pm and again later in the evening.</p><p>Address: The Carlyle, 35 E 76th St, New York, NY 10021</p><p>Book: https://resy.com/cities/new-york-ny/venues/bemelmans-bar</p><p>Website: https://www.rosewoodhotels.com/en/the-carlyle-new-york/dining/bemelmans-bar</p><p>Tags: Classic New York, Cocktails, Easy on the feet, Hotel bar, Late night, Shows &amp; music, Splurge</p></article><article><h3>Chambers</h3><p>Drink · SoHo, Nolita &amp; Tribeca · Wine bar &amp; restaurant · $$$</p><p>Why: It&#x27;s where people who know wine go to let someone else choose, and the food holds up.</p><p>Notes: Even the bartenders know more than most sommeliers. Get the cheese course with a pairing. Prime tables go fast, so book when the two-week window opens.</p><p>Cost: Deep list with back vintages and fair prices for the city.</p><p>Getting in: OpenTable, opening two weeks out. Bar and communal-table seats are held for walk-ins after the first seating.</p><p>Get this: Sit at the bar, order the cheese course, and have the somms pair a few glasses. Stay for dessert.</p><p>The feel: Warm, unfussy neighborhood room run by wine obsessives, with good music.</p><p>Access: Listed as wheelchair accessible; tables, bar and kitchen-counter seats.</p><p>Hours: Nightly from 5:30pm; last dinner seating around 9:30pm.</p><p>Address: 94 Chambers St, New York, NY 10007</p><p>Book: https://www.opentable.com/r/chambers-new-york</p><p>Website: https://www.chambers.nyc/</p><p>Tags: Date night, Easy on the feet, Hard to book, Wine bar</p></article><article><h3>Cubbyhole</h3><p>Drink · West &amp; Greenwich Village · Lesbian bar · $</p><p>Why: A tiny, welcoming West Village classic, an easy stroll from Via Carota and Humm. Early on a weeknight it&#x27;s relaxed, not clubby.</p><p>Notes: Cozy, friendly dive, often packed. Service can be slow and the bathrooms aren&#x27;t great. Cash only.</p><p>Cost: Beer, wine and well drinks about $8-14. Cash only.</p><p>Getting in: Walk-in only. It&#x27;s tiny and packed on Friday and Saturday nights, so go early on a weeknight for a seat.</p><p>Get this: A martini or a simple glass of wine. Look up at the ceiling.</p><p>The feel: Tiny, hung with rainbow lanterns, with a friendly, mixed crowd.</p><p>Access: Tiny, crowded and mostly standing.</p><p>Hours: Mon–Thu 4pm–2am; Fri 4pm–4am; Sat 2pm–4am; Sun 2pm–2am. Happy hour daily.</p><p>Address: 281 W 12th St, New York, NY 10014</p><p>Website: https://www.cubbyholebar.com</p><p>Tags: Late night, Queer bars, Walk-ins welcome</p></article><article><h3>King Cole Bar at the St. Regis</h3><p>Drink · Midtown · Hotel bar at the St. Regis · $$$</p><p>Why: A true old New York hotel bar for a polished drink. The Bloody Mary was born here.</p><p>Notes: Love the mural and the free snack mix. Touristy on weekends and can get too loud to talk. Pair it with Bemelmans.</p><p>Cost: Red Snapper (the house Bloody Mary) about $30, with martinis and classics in the same range.</p><p>Getting in: Walk-in only.</p><p>Get this: The Red Snapper, created here in 1934, or a stiff martini. The free snack mix comes with it.</p><p>The feel: Dark wood, tasseled chairs and the 30-foot Maxfield Parrish Old King Cole mural, with a dressed-up, people-watching crowd.</p><p>Access: Step-free hotel entrance; seated lounge.</p><p>Hours: Daily 4–11pm</p><p>Address: 2 E 55th St, New York, NY 10022</p><p>Website: https://www.marriott.com/en-us/dining/restaurant-bar/nycxr-the-st-regis-new-york/6359135-king-cole-bar.mi</p><p>Tags: Classic New York, Cocktails, Easy on the feet, Hotel bar, Walk-ins welcome</p></article><article><h3>Little Branch</h3><p>Drink · West &amp; Greenwich Village · Cocktail bar · $$</p><p>Why: Sasha Petraske of Milk &amp; Honey opened it, and it still makes precise classic cocktails in one of the darkest, most intimate rooms in the city.</p><p>Notes: This spot has great drinks and a candlelit basement. Can get really crowded, ~30 min line outside. No hats for men, and keep your voice down.</p><p>Cost: Cocktails about $19, beer $8, wine about $17 a glass. Long known as cash only, so bring some to be safe.</p><p>Getting in: No reservations. It&#x27;s first come, first served with a capacity limit, so a line forms on weekends. Show up near the 6pm opening, or late.</p><p>Get this: A classic made to order, like a Sidecar or an Aviation, or tell the bartender what you like and let them build something.</p><p>The feel: An unsigned door at Leroy Street leads down to a candlelit basement of booths, chipped ice and live jazz some nights.</p><p>Access: Down a steep flight of stairs; mostly standing.</p><p>Hours: Sun 6pm–midnight; Mon–Wed 6pm–1am; Thu–Sat 6pm–3am</p><p>Address: 20 7th Ave S, New York, NY 10014</p><p>Tags: Classic New York, Cocktails, Date night, Late night, Shows &amp; music, Walk-ins welcome</p></article><article><h3>Martiny&#x27;s</h3><p>Drink · Flatiron, NoMad &amp; Gramercy · Japanese-style cocktail bar · $$$</p><p>Why: A polished, serious cocktail room and one of the best bars in the world.</p><p>Notes: Fantastic cocktails, great for a special occasion. Hard to get in without booking ahead.</p><p>Cost: Cocktails about $25-30.</p><p>Getting in: Book on Resy 2-3 weeks ahead; a few walk-in spots are held. It&#x27;s harder for three or more.</p><p>Get this: The Tea Ceremony (whiskey and matcha) at the red-leather bar, or the saffron martini.</p><p>The feel: An antique-filled carriage house. Hushed and precise, with seated service.</p><p>Access: Seated service in a carriage house.</p><p>Hours: Daily 6pm–1am</p><p>Address: 121 E 17th St, New York, NY 10003</p><p>Book: https://resy.com/cities/new-york-ny/venues/martinys</p><p>Website: https://www.martinys.com</p><p>Tags: Cocktails, Date night, Easy on the feet, Late night, Splurge</p></article><article><h3>Raines Law Room</h3><p>Drink · Chelsea &amp; Hudson Yards · Speakeasy cocktail bar · $$</p><p>Why: One of the most comfortable dark cocktail rooms in the city, from the team behind Dear Irving. The Chelsea room is back after a building fire and taking Resy bookings again.</p><p>Notes: Very dim and comfortable, with good drinks. No bar to sit at, table service only. If it&#x27;s full, The William on E 39th holds walk-in seats.</p><p>Cost: Prices aren&#x27;t posted online. Figure about $20 a drink, plus small snacks.</p><p>Getting in: Book on Resy for 2 to 6. Larger groups email info@raineslawroom.com. Ring the doorbell at the unmarked entrance and a host seats you.</p><p>Get this: A stirred classic like a Manhattan, or one of the house takes on a Negroni or Old Fashioned.</p><p>The feel: A dim, velvet-curtained parlor with deep couches and a hidden back room where the drinks are made.</p><p>Access: Doorbell entry; deep, low couches.</p><p>Hours: Mon 6pm–midnight; Tue–Wed 5pm–1am; Thu–Fri 5pm–2am; Sat 4pm–2am; Sun 4pm–1am</p><p>Address: 48 W 17th St, New York, NY 10011</p><p>Book: https://resy.com/cities/new-york-ny/venues/raines-law-room</p><p>Website: https://www.raineslawroom.com/</p><p>Tags: Cocktails, Date night, Late night</p></article><article><h3>Someday Bar</h3><p>Drink · Brooklyn · Queer cocktail bar · $$</p><p>Why: A cocktail-forward, community-minded bar that pairs well with a Brooklyn evening.</p><p>Notes: Check Instagram for the night&#x27;s lineup first. Drag and event nights change the noise and the crowd.</p><p>Cost: Cocktails about $15-19.</p><p>Getting in: Mostly walk-in. Tables can be booked through their site, and Instagram has the event nights.</p><p>Get this: A house cocktail. There&#x27;s weekend brunch too.</p><p>The feel: Polished, women-owned bar and community hub. The mood shifts with the night&#x27;s programming.</p><p>Access: Seated at tables or the bar.</p><p>Hours: Mon–Wed 4pm–2am; Thu 4pm–4am; Fri 3pm–4am; Sat noon–4am; Sun noon–2am. Closed Christmas Day.</p><p>Address: 364 Atlantic Ave, Brooklyn, NY 11217</p><p>Website: https://somedaybarnyc.com</p><p>Tags: Brunch, Cocktails, Easy on the feet, Late night, Queer bars, Walk-ins welcome</p></article><article><h3>Terroir Tribeca</h3><p>Drink · SoHo, Nolita &amp; Tribeca · Wine bar · $$</p><p>Why: My first answer for a wine bar, every time, and a fun, unfussy room.</p><p>Notes: Huge by-the-glass list and a soft spot for Riesling. Go right at 4 for an easy table; it gets loud later.</p><p>Cost: Huge by-the-glass list.</p><p>Getting in: Reserve through the form on its site, or walk in early.</p><p>Get this: Riesling, whatever they&#x27;re excited about, and the burger.</p><p>The feel: Loud, friendly, wine-nerd clubhouse with a sense of humor.</p><p>Access: Listed as wheelchair accessible; bar and table seating.</p><p>Hours: Open daily from 4pm.</p><p>Address: 24 Harrison St, New York, NY 10013</p><p>Book: https://www.wineisterroir.com/</p><p>Website: https://www.wineisterroir.com/</p><p>Tags: Walk-ins welcome, Wine bar</p></article><article><h3>The Campbell</h3><p>Drink · Midtown · Cocktail bar in Grand Central · $$$</p><p>Why: A grand, old-world room steps from the train, with dark corners for a quiet drink. The room is the main event.</p><p>Notes: Come for the room and order a classic; the martini holds up, the specialty drinks don&#x27;t. Service lags when it&#x27;s packed with commuters.</p><p>Cost: Cocktails $22 to $26, Old Money (house bourbon pour) $35, beer $12, zero-proof drinks $20.</p><p>Getting in: Walk in for the bar. Tables can be booked through the Resy button on the bar&#x27;s website. Weeknight after-work hours fill up with commuters.</p><p>Get this: A classic like a Vesper or a martini, rather than the sweeter specialty drinks. The Vieux Carré if you want something stirred and strong.</p><p>The feel: A 1920s financier&#x27;s office inside Grand Central, with a 25-foot painted ceiling, a stone fireplace and leather chairs.</p><p>Access: Up from street level in Grand Central; seated armchairs.</p><p>Hours: Daily 12pm–2am; kitchen to midnight</p><p>Address: 15 Vanderbilt Ave, New York, NY 10017</p><p>Book: https://www.thecampbellnyc.com/#action-reservations</p><p>Website: https://www.thecampbellnyc.com/</p><p>Tags: Classic New York, Cocktails, Late night, Walk-ins welcome</p></article><article><h3>The Stonewall Inn</h3><p>Drink · West &amp; Greenwich Village · Historic gay bar · $</p><p>Why: The site of the 1969 uprising and a real piece of history, a short walk from Cubbyhole and Humm. Best as an early-evening stop.</p><p>Notes: Go for the history. Bar service can be slow or rude, and weekends get crowded, so go early on a weekday.</p><p>Cost: Drinks about $6-14. Bring cash.</p><p>Getting in: Walk-in only, 21+ with ID. Expect lines on weekend nights.</p><p>Get this: A drink at the bar. There&#x27;s piano on Tuesdays and Wednesdays and shows on weekends.</p><p>The feel: A genuinely historic room with a mix of tourists and locals. Casual.</p><p>Access: Steps at the entrance; mostly standing, lines on weekends.</p><p>Hours: Mon–Fri 2pm–4am; Sat–Sun 1pm–4am</p><p>Address: 53 Christopher St, New York, NY 10014</p><p>Website: https://thestonewallinnnyc.com</p><p>Tags: Classic New York, Late night, Queer bars, Walk-ins welcome</p></article><article><h3>Ambassadors Clubhouse</h3><p>Eat · Flatiron, NoMad &amp; Gramercy · Punjabi, from London&#x27;s JKS · $$$</p><p>Why: London&#x27;s Punjabi hit, now in New York. Go for the maximalist room and the tandoor dishes, not the curries.</p><p>Notes: The room is the best part. Beetroot chaat and prawns are great; the rest can run heavy. Order family-style to keep things moving.</p><p>Cost: Around $100pp with drinks. Corkage $75.</p><p>Getting in: December tables are already on Resy and go fast. Walk-ins around 5pm can work.</p><p>Get this: The beetroot chaat, the prawns, the crispy chilli cheese and the house-baked breads. Skip dessert.</p><p>The feel: A maximalist party-mansion of a room, loud and high-energy. Smart casual. 13 and over at dinner.</p><p>Access: Seated at tables; large, lively room.</p><p>Hours: Mon–Fri 5–10:30pm; Sat–Sun 12–1:30pm and 5–10:30pm</p><p>Address: 1245 Broadway, New York, NY 10001</p><p>Book: https://resy.com/cities/new-york-ny/venues/ambassadors-clubhouse-new-york</p><p>Website: https://ambassadorsclubhouse.com</p><p>Tags: Easy on the feet, New this year, Walk-ins welcome</p></article><article><h3>Aquavit</h3><p>Eat · Midtown · Modern Scandinavian · $$$$</p><p>Why: A long-running two-star room that&#x27;s calmer, and kinder on the bill, than the three-star tier. A quiet favorite of mine for a long dinner.</p><p>Notes: Unhurried and really well served. Caviar, langoustine and halibut are the standouts. Tasting lunch or the bar is the easy way in; get the horseradish aquavit shot.</p><p>Cost: Dinner tasting menus in two lengths, plus a cheaper 5-course lunch. Figure $200+pp at dinner with drinks.</p><p>Getting in: Book on Tock or OpenTable. Tables are posted months out.</p><p>Get this: One of the tasting menus, or the 5-course lunch for a lighter visit. Add the aquavit flight.</p><p>The feel: Sleek, wood-accented Scandinavian room. Formal and quiet.</p><p>Access: Seated formal dining room.</p><p>Hours: Dinner Thu–Sat; lunch Thu–Fri</p><p>Address: 65 E 55th St, New York, NY 10022</p><p>Book: https://www.opentable.com/aquavit</p><p>Website: https://aquavit.org</p><p>Tags: Easy on the feet, Splurge, Tasting menu</p></article><article><h3>Au Za&#x27;atar</h3><p>Eat · East Village &amp; Lower East Side · Lebanese · $$</p><p>Why: Easygoing East Village Lebanese for a night in. Order on DoorDash or Caviar, or direct from their own site.</p><p>Notes: Lamb kebabs, spicy hummus and the mixed grill are the favorites. Better as delivery; dining in, service is slow and tables are small.</p><p>Cost: Mezze about $9-16, mains about $20-30.</p><p>Getting in: Delivery on DoorDash or Caviar, or order direct at order.auzaatar.com. Phone (212) 254-5660.</p><p>Get this: A mezze spread, lamb kafta, manakish and fattoush.</p><p>The feel: Casual, bright East Village Lebanese cafe.</p><p>Access: Small casual cafe; seated.</p><p>Hours: Daily, roughly 11am–11pm</p><p>Address: 188 Avenue A, New York, NY 10009</p><p>Book: https://www.doordash.com/store/au-zaatar-to-go-12th-st-east-village-17870/</p><p>Website: https://www.auzaatar.com</p><p>Tags: Delivery, Easy on the feet, Walk-ins welcome</p></article><article><h3>Balade</h3><p>Eat · East Village &amp; Lower East Side · Lebanese, halal · $$</p><p>Why: Casual Lebanese where the pitza, their Lebanese flatbread pizza, is the draw. Order on Uber Eats.</p><p>Notes: Dining room and delivery are both solid. Check the bag, an item goes missing now and then.</p><p>Cost: Mains about $18-30.</p><p>Getting in: Delivery on Uber Eats or through Balade&#x27;s own site. To dine in, book on OpenTable or call (212) 529-6868.</p><p>Get this: Mezze, the lamb chops and a pitza.</p><p>The feel: Cozy and lively, with a bar.</p><p>Access: Seated; cozy and lively with a bar.</p><p>Hours: Most days noon–11pm, from 11am on weekends</p><p>Address: 208 First Ave, New York, NY 10009</p><p>Book: https://www.ubereats.com/store/balade-east-village/VIxa3_baTwuACdXY1lchrA</p><p>Website: https://baladerestaurants.com</p><p>Tags: Delivery, Easy on the feet</p></article><article><h3>Balthazar</h3><p>Eat · SoHo, Nolita &amp; Tribeca · French brasserie · $$$</p><p>Why: The reliable showpiece breakfast before a SoHo wander. Weekday breakfast is the calmest.</p><p>Notes: Love the room and the service. Very loud, food can be uneven. Weekday breakfast at 7:30am, walk straight in; weekend brunch without a booking is a 30-60 min wait.</p><p>Cost: Mains about $25-40.</p><p>Getting in: Call (212) 965-1414 or book through the restaurant. Weekend brunch fills up. Weekday walk-ins at 7:30am are usually seated right away.</p><p>Get this: Eggs Benedict or brioche French toast, plus the pastry basket.</p><p>The feel: Red banquettes and a constant buzz. The classic SoHo brasserie.</p><p>Access: Seated at banquettes; busy, loud room.</p><p>Hours: Weekday breakfast about 7:30–11:30am; weekend brunch about 9am–4pm</p><p>Address: 80 Spring St, New York, NY 10012</p><p>Book: https://balthazarny.com/make-booking/</p><p>Website: https://balthazarny.com</p><p>Tags: Brunch, Classic New York, Coffee &amp; breakfast, Easy on the feet, Walk-ins welcome</p></article><article><h3>Border Town</h3><p>Eat · Brooklyn · Sonoran tacos · $$</p><p>Why: Some of the best flour tortillas in the city, from a much-loved taco pop-up that now has its own place. It&#x27;s my go-to casual Brooklyn stop.</p><p>Notes: Come for the flour tortillas. Line to order, then a wait for food, so order everything at once.</p><p>Cost: Tacos $5-7, plates $17-22, cocktails $15.</p><p>Getting in: Walk-in only. It gets packed, so go early or on a weekday.</p><p>Get this: Carne con chile taco, frijoles y queso taco, the mushroom al pastor gringa, and a Cadillac margarita.</p><p>The feel: Casual neighborhood spot near McGolrick Park. Jeans are fine. Busy and loud.</p><p>Access: Walk-in only; busy, with a wait and some counter service.</p><p>Hours: Wed–Sat 5–10pm; Sun 5–9pm; the bar opens at 3pm on weekends; closed Mon–Tue</p><p>Address: 189 Nassau Ave (at Humboldt St), Brooklyn, NY 11222</p><p>Website: https://www.bordertown.co</p><p>Tags: New this year, Walk-ins welcome</p></article><article><h3>Borgo</h3><p>Eat · Flatiron, NoMad &amp; Gramercy · Italian trattoria · $$$</p><p>Why: A grand, candlelit Italian room and one of my favorite date-night dinners. It made New York Magazine&#x27;s best list in 2025.</p><p>Notes: Calm room, simply good food. Service can be a little cool. Go for dinner, not lunch.</p><p>Cost: Pastas and small plates. About $70-100pp.</p><p>Getting in: Resy releases tables 21 days ahead at 10am. From 5pm, the 10-seat bar and three bar-area tables are walk-in.</p><p>Get this: The timballo di anelletti (the star), chitarra integrale with clams and bottarga, focaccia, and the wood-oven half chicken.</p><p>The feel: Grand and candlelit, with white tablecloths. Elegant, and you can actually hear each other.</p><p>Access: Seated at tables or the bar.</p><p>Hours: Dinner daily 5:15–10:30pm; the bar opens at 11:30am for lunch</p><p>Address: 124 E 27th St, New York, NY 10016</p><p>Book: https://resy.com/cities/new-york-ny/venues/borgo</p><p>Website: https://www.borgonyc.com</p><p>Tags: Date night, Easy on the feet, Walk-ins welcome</p></article><article><h3>Clement at The Peninsula</h3><p>Eat · Midtown · Hotel brunch · $$$$</p><p>Why: A proper luxury brunch right on the holiday-window walk.</p><p>Notes: The service and the room are the best part. Food can be inconsistent, and Sunday is good but not special.</p><p>Cost: Sunday buffet $115pp plus tax and 18% gratuity. Saturday is a la carte.</p><p>Getting in: Book on OpenTable or call +1 212 903 3918, a week or more ahead.</p><p>Get this: Saturday&#x27;s a la carte brunch with live music is the better pick. Sunday is the buffet, with piano and champagne.</p><p>The feel: Grand hotel dining room, white-glove and old-school. Smart casual.</p><p>Access: Hotel dining room, seated; elevator to Floor 2.</p><p>Hours: Sat–Sun brunch 11:30am–2:30pm</p><p>Address: 700 Fifth Ave, Floor 2, New York, NY 10019</p><p>Book: https://www.opentable.com/r/clement-new-york</p><p>Website: https://peninsula.com/en/new-york/hotel-fine-dining/clement-restaurant-midtown-manhattan</p><p>Tags: Brunch, Easy on the feet, Splurge</p></article><article><h3>Dominique Ansel Workshop</h3><p>Eat · Flatiron, NoMad &amp; Gramercy · Croissant counter · $</p><p>Why: All the Ansel croissant, none of the Cronut line.</p><p>Notes: The plain croissant is the move, so buttery it melts. Usually no line. Takeout only, so grab a box on the way to brunch.</p><p>Cost: A plain croissant is about $7.</p><p>Getting in: Walk in. Pre-order online 48 hours ahead for pickup.</p><p>Get this: Plain croissant, the olive oil croissant, and a pain au chocolat.</p><p>The feel: A pastry counter inside his production kitchen, quiet and friendly.</p><p>Access: Takeout counter with usually no line; seating not confirmed.</p><p>Hours: Mon–Fri 7am–4pm, Sat–Sun 8am–5pm; closed Dec 25 and Jan 1.</p><p>Address: 17 E 27th St, New York, NY 10016</p><p>Book: https://www.dominiqueanselworkshop.com/</p><p>Website: https://www.dominiqueanselworkshop.com/</p><p>Tags: Coffee &amp; breakfast, Walk-ins welcome</p></article><article><h3>Elder</h3><p>Eat · Chelsea &amp; Hudson Yards · British-Indian chophouse · $$$$</p><p>Why: A new, meat-forward spot from a Michelin-starred chef, and my pick for a dressy dinner near Hudson Yards.</p><p>Notes: Save room for the dessert trolley.</p><p>Cost: Caviar and crumpet $95, Berkshire pork chop about $42. Expect $150+pp with drinks.</p><p>Getting in: Resy opens 30 days ahead at 9am. Walk-ins are welcome.</p><p>Get this: Caviar and crumpet, quail Scotch eggs, the Berkshire pork chop, and the 30-layer potato pavé.</p><p>The feel: An English club: hunter green walls, velvet banquettes and a big circular bar. 100 seats, dressy-casual.</p><p>Access: Seated at banquettes or the bar; modern building.</p><p>Hours: Tue–Sat 5–11pm; closed Sun–Mon</p><p>Address: 517 W 38th St (Henry Hall), New York, NY 10018</p><p>Book: https://resy.com/cities/new-york-ny/venues/elder</p><p>Website: https://restaurantelder.nyc</p><p>Tags: Easy on the feet, New this year, Splurge, Walk-ins welcome</p></article><article><h3>Graciela</h3><p>Eat · West &amp; Greenwich Village · Argentine steakhouse · $$$$</p><p>Why: The first US restaurant from the team behind Buenos Aires&#x27; Don Julio, and the biggest West Village steak opening of 2026. I love it at the bar.</p><p>Notes: Get the ribeye, plus the morcilla and fries. Eat at the bar. Seating can run slow at peak times.</p><p>Cost: Steaks and shared plates. About $100-150pp with wine.</p><p>Getting in: Book on OpenTable, which opens 2 weeks ahead at 10am. They take a few walk-ins, mostly at the bar, and the wait can be as short as 10 minutes on a weeknight.</p><p>Get this: Ojo de bife (Argentine ribeye), the ossobuco empanada, the New York strip milanesa, and dulce de leche flan.</p><p>The feel: Rustic-chic, 120 seats around a big parrilla, with attentive, theatrical service. Business casual.</p><p>Access: Large seated dining room around the grill.</p><p>Hours: Mon–Wed 5–10pm; Thu–Sat 5–11pm; closed Sun</p><p>Address: 81 Greenwich Ave (corner of Bank St), New York, NY 10014</p><p>Book: https://www.opentable.com/r/graciela-new-york</p><p>Tags: Date night, Easy on the feet, Splurge</p></article><article><h3>Gramercy Tavern</h3><p>Eat · Flatiron, NoMad &amp; Gramercy · Seasonal American · $$$$</p><p>Why: Two ways in under one roof: a polished tasting in back, or a walk-in bar meal up front that rarely misses. Years of consistent cooking and warm service.</p><p>Notes: Outstanding front and back, but the Tavern burger and front room beat the tasting. Walk into the Tavern bar early or mid-afternoon; ~30 min wait Friday evenings.</p><p>Cost: Dining Room five-course seasonal menu $178pp, wine pairing $118. Tavern a la carte mains $32 to $42, Tavern burger $36.</p><p>Getting in: Tables open 28 days ahead at noon on OpenTable (separate listings for the Dining Room and the Tavern), or call 212-477-0777 from 12pm to 9pm. The Tavern bar is always walk-in.</p><p>Get this: In the Tavern, the burger with duck-fat potato chips and a martini. In the Dining Room, the seasonal five courses.</p><p>The feel: A busy, wood-beamed front tavern with a wood-burning grill, and a quieter, flower-filled dining room behind it.</p><p>Access: Seated at tables or the tavern bar.</p><p>Hours: Tavern daily 11:30am–11pm; Dining Room lunch daily from 11:45am, dinner from 5pm to 9pm Sun–Thu and 10pm Fri–Sat</p><p>Address: 42 E 20th St, New York, NY 10003</p><p>Book: https://www.opentable.com/r/gramercy-tavern-reservations-new-york?restref=942</p><p>Website: https://www.gramercytavern.com/</p><p>Tags: Classic New York, Date night, Easy on the feet, Splurge, Tasting menu, Walk-ins welcome</p></article><article><h3>Humm</h3><p>Eat · West &amp; Greenwich Village · Wood-fired American · $$$</p><p>Why: Daniel Humm&#x27;s relaxed, a la carte answer to Eleven Madison Park, new this fall. I love the room and the art, and it&#x27;s worth it even if you only sit at the bar.</p><p>Notes: Warmer and looser than Eleven Madison Park. Still new, so the odd dish is uneven. Walk in for the bar menu and the art.</p><p>Cost: A la carte. Around $100pp with drinks.</p><p>Getting in: Resy opens 3 weeks ahead at noon. Some seats are held for walk-ins, especially at the bar.</p><p>Get this: Caviar bagel on milk bread, roast chicken for two with brioche stuffing, the milk soft-serve sundae, and the Humm Martini from the tableside cart.</p><p>The feel: Warm reds and ochres, a painted ceiling and serious art on the walls. 90 seats plus a lounge. Casual-dressy.</p><p>Access: Seated dining room and lounge.</p><p>Hours: Sun–Thu 5–10pm; Fri–Sat 5–10:30pm</p><p>Address: 435 Hudson St, New York, NY 10014</p><p>Book: https://resy.com/cities/new-york-ny/venues/humm</p><p>Tags: Easy on the feet, New this year, Walk-ins welcome</p></article><article><h3>Iara</h3><p>Eat · East Village &amp; Lower East Side · Brazilian-Amazonian · $$</p><p>Why: One of the best openings this fall, and I love it. Unusual Amazonian-Brazilian cooking and a buzzy counter.</p><p>Notes: The picanha, moqueca and cassava fries are the hits. Counter seats put you in the action but get loud, so ask for a table if you want quiet.</p><p>Cost: Shared plates, most under $20. The 10oz picanha is the big-ticket item.</p><p>Getting in: Resy opens 14 days ahead at noon. Walk-ins are welcome if you show up at 5pm, and there&#x27;s a 13-seat chef&#x27;s counter.</p><p>Get this: Pão de queijo with three dips, the full picanha (not the small skewer) with Amazonian au poivre, the moqueca, and cassava fries with açaí ketchup.</p><p>The feel: Open kitchen, woodsmoke and hand-painted murals. Casual, loud and busy.</p><p>Access: Seated at tables; open kitchen, busy and loud.</p><p>Hours: Tue–Sat 5–11pm; closed Sun–Mon</p><p>Address: 205 Allen St, New York, NY 10002</p><p>Book: https://resy.com/cities/new-york-ny/venues/iara</p><p>Website: https://iara.nyc</p><p>Tags: Easy on the feet, New this year, Walk-ins welcome</p></article><article><h3>Jean-Georges</h3><p>Eat · Lincoln Center &amp; Columbus Circle · French-Asian tasting menu · $$$$</p><p>Why: Classic fine dining looking right out at Central Park, and I always go back. Nougatine, the casual room next door, is the cheaper way in.</p><p>Notes: Great service, park views, bread and the mignardises cart. At Nougatine, ask for the front room; courses can have long gaps.</p><p>Cost: Dinner tasting menus $238-398pp (the 6-course is $298), before wine, tax and tip. Lunch prix fixe $128.</p><p>Getting in: Book on Resy, OpenTable or SevenRooms. The restaurant&#x27;s site links to all three.</p><p>Get this: The 6- or 10-course tasting menu, or the vegetarian menu.</p><p>The feel: Formal and quiet, with Central Park views. Jackets encouraged; no jeans or sneakers.</p><p>Access: Step-free hotel entrance; all seated.</p><p>Hours: Lunch Tue–Sat 12–2pm; dinner Tue–Sat 4:45–9:30pm; closed Sun–Mon</p><p>Address: 1 Central Park West, New York, NY 10023</p><p>Book: https://resy.com/cities/new-york-ny/venues/jean-georges</p><p>Website: https://www.jean-georgesrestaurant.com</p><p>Tags: Easy on the feet, Splurge, Tasting menu, Views</p></article><article><h3>Jungsik</h3><p>Eat · SoHo, Nolita &amp; Tribeca · Korean tasting menu · $$$$</p><p>Why: The first Korean restaurant in the US to earn three Michelin stars, and still the reference point for Korean fine dining here. The opening banchan bites show the kitchen at its sharpest.</p><p>Notes: One of the best tasting menus in town. Opening banchan and fried octopus are the highlights; later courses can feel formulaic. The bar is the easier seat.</p><p>Cost: Signature tasting menu $335pp, whole table required. Pairings run $145-600.</p><p>Getting in: Book on Tock, linked from the restaurant&#x27;s site. Prime weekend tables go first, so set an alert.</p><p>Get this: The Signature Menu with the sea urchin bibimbap supplement. The crisp fried octopus with gochujang aioli is the standout course.</p><p>The feel: A calm, polished Tribeca room, with staff in color-coded jackets moving through a long, precise Korean tasting.</p><p>Access: Seated tasting menu.</p><p>Hours: Tue–Sun 5–9:30pm; closed Mon</p><p>Address: 2 Harrison St, New York, NY 10013</p><p>Book: https://www.exploretock.com/jungsik</p><p>Website: https://www.jungsik.com/</p><p>Tags: Date night, Easy on the feet, Hard to book, Splurge, Tasting menu</p></article><article><h3>Kabawa</h3><p>Eat · East Village &amp; Lower East Side · Caribbean prix fixe · $$$$</p><p>Why: One of my favorites this year, and three courses make an easier night than a marathon tasting.</p><p>Notes: Food and service are great. Loud room, but that&#x27;s part of the fun. If it&#x27;s full, walk in to Bar Kabawa next door and get the pepper pot duck patty.</p><p>Cost: Three-course prix fixe, $150pp before drinks, tax and tip.</p><p>Getting in: Book through Momofuku&#x27;s site, and know it&#x27;s hard.</p><p>Get this: Roti and bammy, the Pepper Shrimp (raw royal red shrimp with sorrel and scotch bonnet), the goat with spicy scallop creole, and a coconut turnover to share.</p><p>The feel: Dark green, elegant room with a kitchen counter. Dressy-casual, and it gets lively.</p><p>Access: Seated at tables or counter stools; alley entrance.</p><p>Hours: Tue–Sat 5:30–10pm; closed Sun–Mon</p><p>Address: 8 Extra Pl, New York, NY 10003</p><p>Book: https://www.momofuku.com/restaurants/kabawa</p><p>Website: https://www.momofuku.com/restaurants/kabawa</p><p>Tags: Date night, Hard to book, New this year, Splurge</p></article><article><h3>La Tête d&#x27;Or</h3><p>Eat · Flatiron, NoMad &amp; Gramercy · French steakhouse · $$$$</p><p>Why: Daniel Boulud&#x27;s first steakhouse puts French technique on the classics, and the sides and cocktails are as strong as the beef. A steakhouse menu with fine-dining polish.</p><p>Notes: Michelin-level and a top-five steakhouse. The bar, tableside Caesar and prime rib trolley are the highlights; the steak itself is less exciting than the rest.</p><p>Cost: Steaks $58-280; the 16 oz prime ribeye is $126.</p><p>Getting in: Book on Resy or email ltdreservations@danielboulud.com. Business casual: no athletic wear, and no shorts or sandals for men.</p><p>Get this: Prime rib carved from the trolley, the tableside Caesar, black truffle ravioles as a side, and a martini in the bar first.</p><p>The feel: A grand, high-ceilinged Flatiron steakhouse with a leather-paneled bar, plush banquettes and servers carving at the table.</p><p>Access: Seated in a large dining room.</p><p>Hours: Dinner Mon–Sat 5–10:45pm, Sun 5–10pm; lunch Mon–Fri 11:30am–2pm</p><p>Address: 318 Park Ave S, New York, NY 10010</p><p>Book: https://resy.com/cities/new-york-ny/venues/la-tete-dor</p><p>Website: https://www.latetedorbydaniel.com/</p><p>Tags: Cocktails, Date night, Easy on the feet, Splurge</p></article><article><h3>Minetta Tavern</h3><p>Eat · West &amp; Greenwich Village · Tavern and steakhouse · $$$$</p><p>Why: The Black Label Burger made its name, but the room is the reason to go: a lively, old New York dinner done well.</p><p>Notes: Classic, lively dinner. Lean on the meat; the burger is a bit overrated. On a bigger night, share the côte de boeuf for two.</p><p>Cost: Mains $33-57; the Black Label Burger is $38.</p><p>Getting in: Book on Resy, or call (212) 475-3850 if nothing shows online. The 11pm supper service is the easiest slot to land. Smart casual.</p><p>Get this: A martini at the bar, French onion soup, roasted bone marrow and the Black Label Burger.</p><p>The feel: A packed, warm 1937 Village tavern with red banquettes, caricatures on the walls and career waiters who keep the room moving.</p><p>Access: Seated on banquettes; very packed.</p><p>Hours: Dinner daily 5–11pm, supper 11pm–midnight; lunch Wed–Fri 12–3:30pm; brunch Sat–Sun 11am–3:30pm</p><p>Address: 113 MacDougal St, New York, NY 10012</p><p>Book: https://resy.com/cities/new-york-ny/venues/minetta-tavern</p><p>Website: https://www.minettatavernny.com/</p><p>Tags: Classic New York, Date night, Easy on the feet, Hard to book, Splurge</p></article><article><h3>Per Se</h3><p>Eat · Lincoln Center &amp; Columbus Circle · French-American tasting menu · $$$$</p><p>Why: Thomas Keller&#x27;s New York flagship and the full special-occasion evening: park views, Oysters and Pearls, the works.</p><p>Notes: A flawless special-occasion meal and you&#x27;ll be treated like royalty. Classic more than surprising. The chocolates they send you home with are phenomenal.</p><p>Cost: Nine-course tasting menus are $425pp with service included, before wine and tax. Booking takes a $200pp deposit on Tock.</p><p>Getting in: Book on Tock, which opens 30 days ahead. Go for the main dining room; the shorter Salon menu is the lighter option.</p><p>Get this: Oysters and Pearls (tapioca, oysters, white sturgeon caviar), then the chef&#x27;s or vegetable tasting.</p><p>The feel: Formal and quiet, with park views. Wear a jacket.</p><p>Access: Elevator to the 4th floor; all seated.</p><p>Hours: Dinner daily from about 4:30pm; lunch on select days</p><p>Address: 10 Columbus Circle (Time Warner Center, 4th floor), New York, NY 10019</p><p>Book: https://www.exploretock.com/perse</p><p>Website: https://www.thomaskeller.com/perseny</p><p>Tags: Easy on the feet, Splurge, Tasting menu, Views</p></article><article><h3>The Odeon</h3><p>Eat · SoHo, Nolita &amp; Tribeca · French-American brasserie · $$$</p><p>Why: It&#x27;s the grown-up Tribeca brunch, consistent and a little glamorous, and nobody&#x27;s there for the photos.</p><p>Notes: A reliable Tribeca classic that really knows brunch. Easy to pair with Chambers or Terroir, a few blocks away.</p><p>Cost: Brunch dishes about $21–28; steak frites $56.</p><p>Getting in: OpenTable; the Art Deco bar takes walk-ins.</p><p>Get this: Eggs Benedict or smoked salmon Benedict, a croque monsieur, or the buttermilk pancakes.</p><p>The feel: Downtown classic: leather banquettes, wood paneling, people who&#x27;ve been coming for decades.</p><p>Access: Seated at banquettes and tables; call ahead about the entrance.</p><p>Hours: Brunch Sat–Sun 10am–3:30pm.</p><p>Address: 145 W Broadway, New York, NY 10013</p><p>Book: https://www.opentable.com/restref/client/?rid=2221&amp;restref=2221</p><p>Website: https://www.theodeonrestaurant.com/</p><p>Tags: Brunch, Classic New York</p></article><article><h3>Torrisi</h3><p>Eat · SoHo, Nolita &amp; Tribeca · Italian-American · $$$$</p><p>Why: Still one of the hardest tables in New York and the classic Italian-American luxury dinner. I always go back. The bar is the easiest way in.</p><p>Notes: Pastas, duck and affogato are the moves. Bit of a show. For the bar, weeknights are easiest; for lunch, line up ~40 min early.</p><p>Cost: A la carte. Figure $150+pp with drinks. Corkage is $110 a bottle.</p><p>Getting in: Resy opens 30 days ahead for parties up to 6 and goes almost instantly. Late slots are easier than prime time. The bar counter is first-come: line up before the 5pm opening and you&#x27;ll be seated soon after.</p><p>Get this: The tuna with pickled caponata, the Filet Rossini, and whatever the nightly specials are.</p><p>The feel: Polished, loud and scene-y. Dress for it; athletic wear gets turned away. Adults only.</p><p>Access: Seated dinner; walk-in line forms outside.</p><p>Hours: Dinner Mon–Sat 5–11pm; lunch Wed–Sat 11:30am–2pm; closed Sun</p><p>Address: 275 Mulberry St, New York, NY 10012</p><p>Book: https://resy.com/cities/new-york-ny/venues/torrisi</p><p>Website: https://torrisinyc.com</p><p>Tags: Hard to book, Splurge</p></article><article><h3>Union Square Cafe</h3><p>Eat · Flatiron, NoMad &amp; Gramercy · New American brunch · $$$</p><p>Why: It&#x27;s the one people trust for a parent or anyone who wants a nice meal without fuss, and brunch is when it&#x27;s easiest to book.</p><p>Notes: Not crammed, not too loud, great service. Comforting more than exciting, in a good way. Book the dining room for a slow brunch.</p><p>Cost: Brunch mains about $24–40; pastry basket $16.</p><p>Getting in: OpenTable; weekend brunch books up, so reserve a few days ahead.</p><p>Get this: Pastry basket for the table, the ham and Gruyère pithivier or French toast, and a Bibb salad.</p><p>The feel: Polished and calm, with well-spaced tables and very good service.</p><p>Access: Listed as wheelchair accessible; seated dining room.</p><p>Hours: Opens 11:30am weekdays and 11am weekends, with weekend brunch.</p><p>Address: 101 E 19th St, New York, NY 10003</p><p>Book: https://www.opentable.com/union-square-cafe-reservations-new-york?restref=213</p><p>Website: https://www.unionsquarecafe.com/</p><p>Tags: Brunch, Classic New York, Easy on the feet</p></article><article><h3>Via Carota</h3><p>Eat · West &amp; Greenwich Village · Italian · $$$</p><p>Why: The quintessential West Village dinner, and the wait is part of the ritual. One of my favorites. Go early.</p><p>Notes: Always a wait, always worth it. Tight, packed room. Try the bar at an off hour and add the anchovy toast (huge slab of butter).</p><p>Cost: About $70-100pp with a drink; pastas are in the mid-$20s.</p><p>Getting in: A few tables go out on Resy, but most are held for walk-ins. The host takes names from 5pm, the line forms before that, and waits run 1-3 hours. Weekday lunch around 11:30am or an early weekday evening dodges most of it.</p><p>Get this: Cacio e pepe (non-negotiable), the Svizzerina chopped steak to share, grilled artichokes with lemon aioli, and the polipo.</p><p>The feel: Dim and romantic, with vintage dishware and servers in cream jackets. No dress code, lively noise.</p><p>Access: Step-free main entrance on Grove St; seated, but walk-in waits are on the sidewalk.</p><p>Hours: Mon–Fri 11am–11pm; Sat–Sun 10am–11pm</p><p>Address: 51 Grove St, New York, NY 10014</p><p>Book: https://resy.com/cities/new-york-ny/venues/via-carota</p><p>Website: https://www.viacarota.com</p><p>Tags: Date night, Walk-ins welcome</p></article><article><h3>ilili</h3><p>Eat · Flatiron, NoMad &amp; Gramercy · Upscale Lebanese · $$$</p><p>Why: Upscale Lebanese that travels well. Order delivery from ilili&#x27;s own online store, or sit down at the NoMad original.</p><p>Notes: Duck shawarma, hummus and falafel are great. Loud room, service can be slow. Stick to this NoMad original over Midtown, and save room for the knafeh.</p><p>Cost: Kafta $26, baba ghannouj $16, lamb shank $80, mixed grill for two $135.</p><p>Getting in: For delivery or pickup, order through ilili&#x27;s own online store. To dine in, book on OpenTable or call (212) 683-2929.</p><p>Get this: Phoenician fries, crispy brussels sprouts, the lamb shank and the mixed grill.</p><p>The feel: Elegant, mirror-walled Lebanese dining room.</p><p>Access: Seated dining room.</p><p>Hours: Lunch Mon–Fri 11:30am–2:30pm; brunch Sat–Sun 11:30am–3:15pm; dinner Mon 5:30–9:30pm, Tue–Fri 5:30–10pm, Sat 5–10pm, Sun 5–9:30pm</p><p>Address: 236 5th Ave, New York, NY 10001</p><p>Book: https://order.online/store/ilili-nomad-19920?delivery=true</p><p>Website: https://www.ililirestaurants.com</p><p>Tags: Brunch, Delivery, Easy on the feet</p></article></noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js?v=0d2c61e1"></script>
<script>
(function(){
const P = (window.PLACES||[]).map((p,i)=>({...p,id:p.id||('p'+i)}));
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let saved = new Set();
try{ saved = new Set(JSON.parse(localStorage.getItem('nyc-saved')||'[]')); }catch(e){}
const persist=()=>{ try{ localStorage.setItem('nyc-saved',JSON.stringify([...saved])); }catch(e){} };
const state={cat:'all',hood:'',price:'',tag:'',savedOnly:false,active:null};

// filter options
[...new Set(P.map(p=>p.neighborhood).filter(Boolean))].sort().forEach(h=>$('#hood').add(new Option(h,h)));
[...new Set(P.flatMap(p=>p.tags||[]))].sort().forEach(t=>$('#tag').add(new Option(t,t)));

// map
const dark = matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme!=='light';
const map = L.map('map',{zoomControl:true,scrollWheelZoom:true}).setView([40.737,-73.99],12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',maxZoom:19,className:dark?'tiles-dark':''}).addTo(map);
const color = c=>getComputedStyle(document.documentElement).getPropertyValue('--'+c).trim();
const markers={};
P.forEach(p=>{
  if(p.lat==null||p.lng==null) return;
  const icon=()=>L.divIcon({className:'',iconSize:[26,26],iconAnchor:[13,26],popupAnchor:[0,-24],
    html:`<div class="pin ${saved.has(p.id)?'saved':''}" style="background:${color(p.category)}"><span>${p.category==='eat'?'E':p.category==='drink'?'D':'T'}</span></div>`});
  const m=L.marker([p.lat,p.lng],{icon:icon(),title:p.name});
  m.bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.cuisine||'')} · <b style="font-family:Inter">${esc(p.price||'')}</b><br>${esc(p.neighborhood||'')}`);
  m.on('click',()=>focus(p.id,false));
  m._mk=icon; markers[p.id]=m;
});

const dirUrl=p=>`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.name+', '+p.address)}`;
function card(p){
  const r=p.reddit;
  const rows=[
    ['Cost',p.price_note],['Getting in',p.reservations],[p.category==='do'?'Do this':'Get this',p.what_to_order],['The feel',p.vibe],
    ['Access',p.access],['Hours',p.hours_note],['Cred',p.accolades],['Address',p.address]
  ].filter(x=>x[1]).map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('');
  const notes = p.note || [p.say, ...(p.heads_up||[]), p.tip].filter(Boolean).join(' ');
  const reddit = notes ? `<div class="people"><b>Notes:</b> ${esc(notes)}</div>` : '';
  return `<article class="card" id="c-${p.id}" data-id="${p.id}">
    <div class="row"><span class="tag ${p.category}">${esc(p.category)}</span>${p.host_pick?'<span class="tag pick">My pick</span>':''}<span class="price">${esc(p.price||'')}</span><span class="meta">${esc(p.neighborhood||'')} · ${esc(p.cuisine||'')}</span></div>
    <h2 data-focus="${p.id}">${esc(p.name)}</h2>
    <p class="why">${esc(p.why||'')}</p>
    <dl>${rows}</dl>
    ${reddit}
    <div class="links">
      ${p.booking_url?`<a class="primary" href="${esc(p.booking_url)}" target="_blank" rel="noopener">Book</a>`:''}
      ${p.website?`<a href="${esc(p.website)}" target="_blank" rel="noopener">Website</a>`:''}
      <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+', '+p.address)}" target="_blank" rel="noopener">Hours &amp; reviews</a>
      <a href="${dirUrl(p)}" target="_blank" rel="noopener">Directions</a>
      <button class="save" data-save="${p.id}" aria-pressed="${saved.has(p.id)}">${saved.has(p.id)?'★ Saved':'☆ Save'}</button>
    </div>
  </article>`;
}
const priceN=s=>(s||'').replace(/[^$]/g,'').length;
function visible(p){
  if(state.cat!=='all'&&p.category!==state.cat) return false;
  if(state.hood&&p.neighborhood!==state.hood) return false;
  if(state.price&&(state.price==='Free'?p.price!=='Free':priceN(p.price)!==state.price.length)) return false;
  if(state.tag&&!(p.tags||[]).includes(state.tag)) return false;
  if(state.savedOnly&&!saved.has(p.id)) return false;
  return true;
}
function render(){
  const vis=P.filter(visible).sort((a,b)=>(state.cat!=='all'?(b.host_pick?1:0)-(a.host_pick?1:0):0)||a.name.localeCompare(b.name));
  $('#list').innerHTML=vis.map(card).join('')||'<p class="meta">Nothing matches. Loosen a filter.</p>';
  $('#count').textContent=`${vis.length} of ${P.length} places · ${saved.size} saved`;
  const ids=new Set(vis.map(p=>p.id));
  Object.entries(markers).forEach(([id,m])=>{ m.setIcon(m._mk()); ids.has(id)?m.addTo(map):m.remove(); });
  const pts=vis.filter(p=>markers[p.id]).map(p=>[p.lat,p.lng]);
  if(pts.length) map.fitBounds(pts,{padding:[30,30],maxZoom:15});
}
function focus(id,pan=true){
  document.querySelectorAll('.card.active').forEach(c=>c.classList.remove('active'));
  const c=document.getElementById('c-'+id); if(c){c.classList.add('active'); c.scrollIntoView({behavior:'smooth',block:'nearest'});}
  if(pan&&markers[id]){ map.setView(markers[id].getLatLng(),15); markers[id].openPopup(); if(innerWidth<=820) scrollTo({top:0,behavior:'smooth'}); }
}
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.dataset.cat){ state.cat=t.dataset.cat; document.querySelectorAll('[data-cat]').forEach(b=>b.setAttribute('aria-pressed',b===t)); render(); }
  else if(t.id==='savedOnly'){ state.savedOnly=!state.savedOnly; t.setAttribute('aria-pressed',state.savedOnly); render(); }
  else if(t.dataset.save){ const id=t.dataset.save; saved.has(id)?saved.delete(id):saved.add(id); persist(); const y=$('#list').scrollTop; render(); $('#list').scrollTop=y; }
  else if(t.dataset.focus){ focus(t.dataset.focus); }
});
['hood','price','tag'].forEach(k=>$('#'+k).addEventListener('change',e=>{state[k]=e.target.value;render();}));
$('#footnote').textContent=`Anything you ☆ stays saved on this device.`;
render();
})();
</script>
</body>
</html>
